[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demineur"
version = "0.0.1"
description = "A simple Minesweeper game using PySide6"
authors = [
  { name = "Jules", email = "jules@example.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.0.0",
    "SQLAlchemy>=1.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
demineur = "demineur.__main__:main"
