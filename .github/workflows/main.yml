name: Validation Python S6

on:
  workflow_dispatch: # Permet de lancer le pipeline manuellement
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 SQLAlchemy flake8 # On ajoute flake8 ici
        
    - name: Vérification du Lint (PEP 8)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        # --select=E9,F63,F7,F82 : erreurs critiques
        # --max-line-length=127 : autorise des lignes un peu plus longues (standard 79)
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Verification du lancement (Syntax Check)
      run: |
        python -m compileall .